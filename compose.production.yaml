name: reador-production

services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: reador
      POSTGRES_DB: reador
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请配置 .env.production 中的数据库密码}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reador -d reador"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  app:
    image: ${READOR_IMAGE:?请指定 GHCR 镜像版本或摘要}
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:${APP_PORT:-3112}:3000"
    environment:
      DATABASE_URL: postgres://reador:${POSTGRES_PASSWORD}@db:5432/reador
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请配置 .env.production 中的加密密钥}
      APP_ORIGIN: ${APP_ORIGIN:?请配置公开访问地址}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOAD_DIR: /app/storage
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - book_storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  book_storage:
