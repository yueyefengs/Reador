name: 构建并发布镜像

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 发布 main 中的 tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出 tag 对应代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # tag 事件没有所属分支，必须显式检查提交已进入 main。
      - name: 校验 main 归属与镜像标签
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::Git tag 必须符合 Docker 标签规则：1–128 个字母、数字、下划线、点或连字符，不能以点或连字符开头。'
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo '::error::tag 指向的提交尚未进入 main，拒绝发布镜像。'
            exit 1
          fi
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 配置多架构模拟
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: 登录 GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 amd64 / arm64 镜像
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出部署镜像地址
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### 镜像发布完成'
            echo
            echo "版本：\`$IMAGE:$RELEASE_TAG\`"
            echo
            echo "固定摘要：\`$IMAGE@$DIGEST\`"
            echo
            echo '服务端部署步骤见仓库 docs/deployment.md。'
          } >> "$GITHUB_STEP_SUMMARY"
