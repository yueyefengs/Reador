services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: reador
      POSTGRES_DB: reador
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行 npm run setup:env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reador -d reador"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${APP_PORT:-3112}:3000"
    environment:
      DATABASE_URL: postgres://reador:${POSTGRES_PASSWORD}@db:5432/reador
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请先运行 npm run setup:env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3112}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /app/storage
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
volumes:
  postgres_data:
